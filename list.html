<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>インターン募集一覧｜Voluntell インターンシップNAVI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== ヘッダー（トップページと同じ） ========== -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="site-name"><img class="site-logo" src="images/voluntell-internship-navi-logo-web.png" alt="Voluntell インターンシップNAVI" width="566" height="108"></a>
      <nav class="header-nav">
        <a href="list.html" class="nav-pc">募集を探す</a>
        <a href="index.html#company" class="nav-company"><span class="label-full">企業の方はこちら</span><span class="label-short">企業の方へ</span></a>
      </nav>
    </div>
  </header>

  <main class="container container-narrow list-page">

    <a href="index.html" class="back-link">← トップページに戻る</a>

    <h1 class="list-title">インターン募集一覧</h1>
    <p class="list-lead"><span id="job-count" aria-live="polite"></span>・新着順に表示しています</p>
    <p class="notice-monitor">※現在掲載中の5社は、モニター掲載用のサンプルです。募集内容は正式掲載時に企業と確認のうえ決定します。</p>

    <div class="field list-search" role="search">
      <label for="job-search">募集を検索</label>
      <input type="search" id="job-search" name="q" autocomplete="off" placeholder="企業名・募集名・地域など">
    </div>

    <!-- 募集カードは list.js が jobs-data.js を読んで、ここに表示します -->
    <div class="card-grid card-grid-single" id="job-list"></div>
    <p class="list-empty" id="job-empty" role="status" hidden>条件に合う募集が見つかりません。キーワードを変えてお試しください。</p>

    <noscript>
      <p class="list-lead">募集を表示するには、JavaScript を有効にしてください。</p>
    </noscript>

  </main>

  <!-- ========== フッター（トップページと同じ） ========== -->
  <footer class="footer">
    <div class="container">
      <p class="footer-name">Voluntell インターンシップNAVI</p>
      <nav class="footer-nav">
        <a href="company.html">運営者情報</a>
        <a href="terms.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="consult.html">企業の掲載相談</a>
      </nav>
      <p class="copyright">&copy; Voluntell</p>
    </div>
  </footer>

  <script src="jobs-data.js"></script>
  <script src="site-config.js"></script>
  <script src="cards.js"></script>
  <script src="list.js"></script>
</body>
</html>
