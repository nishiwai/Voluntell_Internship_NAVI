<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>募集詳細｜Voluntell インターンシップNAVI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="detail-page">

  <!-- ========== ヘッダー（トップページと同じ） ========== -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="site-name"><img class="site-logo" src="images/voluntell-internship-navi-logo-web.png" alt="Voluntell インターンシップNAVI" width="566" height="108"></a>
      <nav class="header-nav">
        <a href="list.html" class="nav-pc">募集を探す</a>
        <a href="index.html#company" class="nav-company"><span class="label-full">企業の方はこちら</span><span class="label-short">企業の方へ</span></a>
      </nav>
    </div>
  </header>

  <main class="container container-narrow detail">

    <a href="list.html" class="back-link">← 募集一覧に戻る</a>

    <!-- ========== 募集の中身 ==========
         このページはどの企業でも同じ形です。
         アドレスの ?job=募集ID（例: detail.html?job=tajima-kogyo）に合わせて、
         detail.js が jobs-data.js の内容をここに表示します。 -->
    <div id="detail-root"></div>

    <noscript>
      <p class="list-lead">募集を表示するには、JavaScript を有効にしてください。</p>
    </noscript>

  </main>

  <!-- ========== 申し込みボタン（画面の下に固定表示） ==========
       リンク先は detail.js が、表示中の募集に合わせて設定します。 -->
  <div class="apply-bar" id="apply-bar" hidden>
    <div class="container container-narrow">
      <a href="#" id="apply-bar-link" class="btn btn-primary btn-large btn-block">このインターンに申し込む</a>
    </div>
  </div>

  <!-- ========== フッター（トップページと同じ） ========== -->
  <footer class="footer">
    <div class="container">
      <p class="footer-name">Voluntell インターンシップNAVI</p>
      <nav class="footer-nav">
        <span>運営者情報（準備中）</span>
        <span>利用規約（準備中）</span>
        <span>プライバシーポリシー（準備中）</span>
        <a href="consult.html">企業の掲載相談</a>
      </nav>
      <p class="copyright">&copy; Voluntell</p>
    </div>
  </footer>

  <script src="jobs-data.js"></script>
  <script src="cards.js"></script>
  <script src="detail.js"></script>
</body>
</html>
